<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>VELVERO | Login</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="login.css" />
    </head>
    <body>
        <main class="login-container">
            <div class="login-card">
                <div class="login-brand">
                    <a href="index.html" class="logo">VELVERO</a>
                </div>
                <div class="login-header">
                    <h1 class="login-title">Masuk ke akunmu</h1>
                    <p class="login-subtitle">Gunakan username & password akunmu.</p>
                </div>
                <form class="login-form" action="index.html" method="get">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Masukkan username"
                            required
                        />
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Masukkan password"
                            required
                        />
                    </div>
                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" name="remember" />
                            <span>Ingat saya</span>
                        </label>
                        <a href="#" class="forgot-password">Lupa password?</a>
                    </div>
                    <button type="submit" class="btn-login">Masuk</button>
                </form>
            </div>
            <div class="login-decoration">
                <div class="decoration-circle circle-1"></div>
                <div class="decoration-circle circle-2"></div>
                <div class="decoration-circle circle-3"></div>
            </div>
        </main>

        <div id="suc-modal" class="success-modal">
            <div class="success-modal-content">
                <button id="suc-modal-close" class="close-modal">&times;</button>
                <div class="success-icon">✓</div>
                <h2>Login Berhasil!</h2>
                <p id="suc-modal-message"></p>
                <button id="suc-modal-ok" class="modal-ok">Mulai belanja</button>
            </div>
        </div>

        <script src="login.js"></script>
    </body>
</html>
